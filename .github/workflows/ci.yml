
name: Advanced Python CI Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      deployment_environment:
        description: "Choose deployment environment"
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

permissions:
  contents: read

jobs:
  # Reusable CI workflow: matrix testing, linting and packaging
  ci:
    name: Run Reusable Python CI
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      python_versions: '["3.10", "3.11", "3.12", "3.13"]'
      fail_fast: false

  # Deploy package to staging
  staging:
    name: Staging Deployment
    needs: ci

    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        inputs.deployment_environment == 'staging'
      }}

    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Download Python package
        uses: actions/download-artifact@v4
        with:
          name: python-package-${{ needs.ci.outputs.build-version }}
          path: dist/

      - name: Display package details
        run: |
          echo "Build version: ${{ needs.ci.outputs.build-version }}"
          echo "Package filename: ${{ needs.ci.outputs.package-filename }}"
          echo "Downloaded package:"
          ls -lh dist/

      - name: Staging deployment placeholder
        run: |
          echo "Deploying package to staging..."
          echo "Staging deployment completed."

  # Production deployment requires a version tag
  production:
    name: Production Release
    needs: ci

    if: >-
      ${{
        startsWith(github.ref, 'refs/tags/v') &&
        (
          github.event_name == 'push' ||
          (
            github.event_name == 'workflow_dispatch' &&
            inputs.deployment_environment == 'production'
          )
        )
      }}

    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download Python package
        uses: actions/download-artifact@v4
        with:
          name: python-package-${{ needs.ci.outputs.build-version }}
          path: dist/

      - name: Display release details
        run: |
          echo "Production release version: ${{ needs.ci.outputs.build-version }}"
          echo "Package filename: ${{ needs.ci.outputs.package-filename }}"
          echo "Release package:"
          ls -lh dist/

      - name: Production deployment placeholder
        run: |
          echo "Deploying package to production..."
          echo "Production release completed."
