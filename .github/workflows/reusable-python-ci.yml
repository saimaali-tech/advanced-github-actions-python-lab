---
name: Reusable Python CI

on:
  workflow_call:
    inputs:
      python_versions:
        description: "Python versions to test"
        required: false
        type: string
        default: '["3.10", "3.11", "3.12", "3.13"]'

      fail_fast:
        description: "Stop matrix jobs after the first failure"
        required: false
        type: boolean
        default: false

    outputs:
      build-version:
        description: "Generated package version"
        value: ${{ jobs.prepare.outputs.build-version }}

      package-filename:
        description: "Generated wheel filename"
        value: ${{ jobs.package.outputs.package-filename }}

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare Build Version
    runs-on: ubuntu-24.04

    outputs:
      build-version: ${{ steps.version.outputs.build-version }}

    steps:
      - name: Generate build version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.1.0-run-${GITHUB_RUN_NUMBER}"
          fi

          echo "build-version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Build version: $VERSION"

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04

    needs: prepare

    strategy:
      fail-fast: ${{ inputs.fail_fast }}
      matrix:
        python-version: ${{ fromJSON(inputs.python_versions) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  lint:
    name: Code Quality - Ruff
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Show Ruff version
        run: ruff --version

      - name: Run Ruff lint checks
        run: ruff check --output-format=github .

  package:
    name: Build Python Package
    runs-on: ubuntu-24.04

    needs:
      - prepare
      - test
      - lint

    outputs:
      package-filename: ${{ steps.package-info.outputs.package-filename }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Update package version
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.build-version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("pyproject.toml")
          content = path.read_text()
          content = content.replace(
              'version = "0.1.0"',
              f'version = "{os.environ["BUILD_VERSION"]}"',
              1,
          )
          path.write_text(content)
          PY

      - name: Build package
        run: python -m build

      - name: Capture package filename
        id: package-info
        shell: bash
        run: |
          PACKAGE_FILE=$(find dist -maxdepth 1 -name "*.whl" -printf "%f\n" | head -n 1)

          if [[ -z "$PACKAGE_FILE" ]]; then
            echo "No wheel package found!"
            exit 1
          fi

          echo "package-filename=$PACKAGE_FILE" >> "$GITHUB_OUTPUT"
          echo "Package: $PACKAGE_FILE"

      - name: Upload versioned package artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package-${{ needs.prepare.outputs.build-version }}
          path: dist/
          retention-days: 14
