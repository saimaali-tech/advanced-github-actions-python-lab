name: Reusable Python CI

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON array of Python versions
        required: false
        type: string
        default: '["3.10", "3.11", "3.12"]'
    outputs:
      build-version:
        description: Version label used for this run's artifacts
        value: ${{ jobs.prepare.outputs.build-version }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build-version: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="0.1.0-run-${GITHUB_RUN_NUMBER}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

  test-and-package:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use composite setup action
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build distribution
        run: python -m build

      - name: Rename build output with version and Python version
        shell: bash
        run: |
          mkdir -p packaged
          cp dist/* packaged/
          echo "Build version: ${{ needs.prepare.outputs.build-version }}" > packaged/BUILD_INFO.txt
          echo "Python version: ${{ matrix.python-version }}" >> packaged/BUILD_INFO.txt

      - name: Upload versioned artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package-${{ needs.prepare.outputs.build-version }}-py${{ matrix.python-version }}
          path: packaged/
          if-no-files-found: error
          retention-days: 14
